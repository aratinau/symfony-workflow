framework:
    workflows:
        public_status:
            type: 'workflow' # or 'state_machine'
            audit_trail:
                enabled: true
            marking_store:
                type: 'method'
                property: 'publicStatus'
            supports:
                - App\Entity\BaseItem
            initial_marking: SENT
            places:
                - SENT
                - READ
                - ARCHIVED
                - CANCELLED
                - NOT_READ
            transitions:
                to_read:
                    from: SENT
                    to: READ
                archive:
                    from: READ
                    to: ARCHIVED
                cancel:
                    from: [SENT, READ]
                    to: CANCELLED
                mark_not_read:
                    from: READ
                    to: NOT_READ
